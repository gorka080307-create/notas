<!-- Pantalla de bloqueo -->
<section id="lock" class="lock" aria-label="Pantalla de bloqueo">
  <div class="lock-in">
    <div class="lock-time" id="lockTime" data-clock="m">--:--</div>
    <div class="lock-date" id="lockDate" data-date>&nbsp;</div>
    <div class="lock-card">
      <div class="lock-ico" aria-hidden="true">🔒</div>
      <div class="lock-msg" id="lockMsg">Introduce el código</div>
      <div class="dots" id="dots" aria-hidden="true"></div>
      <div class="pad" id="pad"></div>
    </div>
  </div>
</section>

<!-- Aplicación -->
<div id="app" class="app" hidden>
  <nav class="side" id="side" aria-label="Secciones"></nav>
  <main class="main" id="main"></main>
</div>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" role="status"></div>
